<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>People directory — planner-flip repro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h1 class="h3 mb-3">People directory</h1>
    <p class="text-muted">
      Search for the rare seeded name (default <code>ronald quibble</code>) and
      watch the request stall; search a common surname and it returns instantly.
    </p>
    <table id="people_table" class="table table-striped w-100">
      <thead>
        <tr>
          <th>Full name</th>
          <th>ID</th>
        </tr>
      </thead>
    </table>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
  <script>
    $(function () {
      $('#people_table').DataTable({
        processing: true,
        serverSide: true,
        pageLength: 25,
        searchDelay: 500,
        order: [[0, 'asc']],
        ajax: '/api/people/?format=datatables',
        columns: [
          { data: 'full_name', name: 'full_name', searchable: true, orderable: true },
          { data: 'id', name: 'id', searchable: false, orderable: false }
        ]
      });
    });
  </script>
</body>
</html>
